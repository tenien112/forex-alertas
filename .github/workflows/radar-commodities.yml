name: Vigilante RADAR COMMODITIES

on:
  # Solo prueba manual: la vigilancia programada va dentro de vigilante.yml
  workflow_dispatch:
    inputs:
      prueba:
        description: "Enviar aviso de prueba con el estado actual"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: vigilante
  cancel-in-progress: false

jobs:
  vigilar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Ejecutar vigilante RADAR COMMODITIES
        run: |
          if [ "${{ github.event.inputs.prueba }}" = "true" ]; then
            python vigilante_radar_commodities.py --prueba || (sleep 30 && python vigilante_radar_commodities.py --prueba)
          else
            python vigilante_radar_commodities.py || (sleep 30 && python vigilante_radar_commodities.py)
          fi
      - name: Guardar hora del último aviso
        run: |
          if [ -n "$(git status --porcelain estado_radar_commodities.json resumen_radar_commodities.txt)" ]; then
            git config user.name "vigilante-radar-commodities"
            git config user.email "vigilante-radar-commodities@users.noreply.github.com"
            for f in estado_radar_commodities.json resumen_radar_commodities.txt; do [ -f "$f" ] && git add "$f"; done
            git commit -m "Vigilante RADAR COMMODITIES: último aviso"
            git pull --rebase origin main && git push origin HEAD:main
          fi
