name: Vigilante ATALAYA

on:
  schedule:
    # 5:58 y 6:58 UTC = 7:58 en Madrid (verano o invierno); el script solo avisa entre 7:50 y 8:40 de Madrid
    - cron: "58 5 * * *"
    - cron: "58 6 * * *"
  workflow_dispatch:
    inputs:
      prueba:
        description: "Enviar aviso de prueba ahora"
        type: boolean
        default: false

jobs:
  vigilar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Ejecutar vigilante ATALAYA
        run: |
          if [ "${{ github.event.inputs.prueba }}" = "true" ]; then
            python atalaya.py --prueba || (sleep 30 && python atalaya.py --prueba)
          else
            python atalaya.py || (sleep 30 && python atalaya.py)
          fi
