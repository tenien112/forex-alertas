name: Prueba RADAR M5-M30-H1-H2
on:
  push:
    branches: [prueba-m5h2]
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - run: python vigilante_radar_m5h2.py --prueba > salida.txt 2>&1; cat salida.txt
      - uses: actions/upload-artifact@v4
        with: {name: salida, path: salida.txt}
