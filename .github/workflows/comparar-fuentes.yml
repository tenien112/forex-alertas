name: Comparar radar Yahoo frente a cTrader

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  comparar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python comparar_fuentes.py
      - name: Guardar comparación
        run: |
          git config user.name "comparar"
          git config user.email "comparar@users.noreply.github.com"
          git add comparacion.md
          git commit -m "Comparación radar Yahoo / cTrader" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -X theirs origin main && git push origin HEAD:main && break; sleep 3; done
