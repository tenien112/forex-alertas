name: Vigilante COMUNES M5-H4

on:
  # Prueba manual del aviso COMUNES M5-H4 (el automático va cada 30 min dentro de vigilante.yml)
  workflow_dispatch:
    inputs:
      prueba:
        description: "Enviar aviso de prueba con las coincidencias actuales"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  vigilar:
    runs-on: ubuntu-latest
    env:
      CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
      RADAR_FUENTE: ctrader      # radares y robots con precios de cTrader; Yahoo solo de reserva si cTrader falla
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Ejecutar vigilante COMUNES M5-H4
        run: |
          if [ "${{ github.event.inputs.prueba }}" = "true" ]; then
            python vigilante_comunes_m5h4.py --prueba || (sleep 30 && python vigilante_comunes_m5h4.py --prueba)
          else
            python vigilante_comunes_m5h4.py || (sleep 30 && python vigilante_comunes_m5h4.py)
          fi
      - name: Guardar coincidencias
        run: |
          if [ -n "$(git status --porcelain estado_comunes_m5h4.json)" ]; then
            git config user.name "vigilante-comunes-m5h4"
            git config user.email "vigilante-comunes-m5h4@users.noreply.github.com"
            git add estado_comunes_m5h4.json
            git commit -m "Vigilante COMUNES M5-H4: coincidencias"
            for i in 1 2 3 4 5; do git pull --rebase -X theirs origin main && git push origin HEAD:main && break; sleep $((RANDOM % 5 + 2)); done
          fi
