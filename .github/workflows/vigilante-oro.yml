name: Vigilante BOT COMPRA-VENTA ORO, PLATA, BITCOIN Y OIL

on:
  # Solo prueba manual: la vigilancia programada va dentro de vigilante.yml
  workflow_dispatch:
    inputs:
      prueba:
        description: "Enviar aviso de prueba con el estado actual"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: vigilante
  cancel-in-progress: false

jobs:
  vigilar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Ejecutar vigilante ORO y PLATA
        run: |
          if [ "${{ github.event.inputs.prueba }}" = "true" ]; then
            python vigilante_oro.py --prueba || (sleep 30 && python vigilante_oro.py --prueba)
          else
            python vigilante_oro.py || (sleep 30 && python vigilante_oro.py)
          fi
      - name: Guardar hora del último aviso
        run: |
          if [ -n "$(git status --porcelain estado_oro.json)" ]; then
            git config user.name "vigilante-oro"
            git config user.email "vigilante-oro@users.noreply.github.com"
            git add estado_oro.json
            git commit -m "Vigilante ORO: último aviso"
            git pull --rebase origin main && git push origin HEAD:main
          fi
