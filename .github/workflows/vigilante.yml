name: Vigilante RADAR CAMBIO TENDENCIAS

# Un solo trabajo cada 30 minutos que revisa el FOREX y además el ORO y la PLATA
# (juntos para gastar la mitad de minutos gratuitos de GitHub).
on:
  schedule:
    # Cada 30 minutos (minutos 3 y 33 UTC), de domingo a viernes UTC.
    # El FOREX solo se vigila de lunes a viernes (hora de Madrid); el oro abre el domingo noche.
    - cron: "3,33 * * * 0-5"
  workflow_dispatch:
    inputs:
      prueba:
        description: "Enviar aviso de prueba con el estado actual del FOREX"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  vigilar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # 01/11/2026: Lorenzo pidió quitar todos los avisos automáticos menos COMUNES M5-H4.
      # Los demás vigilantes solo se ejecutan a mano (modo prueba, desde la app BOLSA).
      - name: Ejecutar vigilante FOREX (solo a mano, modo prueba)
        if: github.event.inputs.prueba == 'true'
        run: python alertas_forex.py --prueba || (sleep 30 && python alertas_forex.py --prueba)
      - name: Ejecutar vigilante COMUNES M5-H4 (único aviso automático)
        if: github.event.inputs.prueba != 'true'
        run: python vigilante_comunes_m5h4.py || (sleep 30 && python vigilante_comunes_m5h4.py)
      - name: Ejecutar vigilante ORO y PLATA
        # También cuando lo lanza el despertador externo (cron-job.org) sin modo prueba
        if: false   # avisos automáticos desactivados el 01/11/2026
        continue-on-error: true
        run: |
          if [ "${{ github.event.schedule }}" = "45 7 * * 1-5" ]; then
            python vigilante_oro.py --resumen || (sleep 30 && python vigilante_oro.py --resumen)
          else
            python vigilante_oro.py || (sleep 30 && python vigilante_oro.py)
          fi
      - name: Ejecutar vigilante BOT COMMODITIES (metales, petróleo y criptos en H1-H8)
        if: false   # avisos automáticos desactivados el 01/11/2026
        continue-on-error: true
        run: |
          if [ "${{ github.event.schedule }}" = "45 7 * * 1-5" ]; then
            python vigilante_commodities.py --resumen || (sleep 30 && python vigilante_commodities.py --resumen)
          else
            python vigilante_commodities.py || (sleep 30 && python vigilante_commodities.py)
          fi
      - name: Ejecutar vigilante COMMODITIES RADAR 5 TEMPORALIDADES 2 SALIDAS (metales, petróleo y criptos en M30-H8)
        if: false   # avisos automáticos desactivados el 01/11/2026
        continue-on-error: true
        run: |
          if [ "${{ github.event.schedule }}" = "45 7 * * 1-5" ]; then
            python vigilante_radar_commodities.py --resumen || (sleep 30 && python vigilante_radar_commodities.py --resumen)
          else
            python vigilante_radar_commodities.py || (sleep 30 && python vigilante_radar_commodities.py)
          fi
      - name: Ejecutar vigilante FOREX RADAR 5 TEMPORALIDADES 2 SALIDAS (divisas en M30-H8)
        if: false   # avisos automáticos desactivados el 01/11/2026
        continue-on-error: true
        run: |
          if [ "${{ github.event.schedule }}" = "45 7 * * 1-5" ]; then
            python vigilante_radar_forex.py --resumen || (sleep 30 && python vigilante_radar_forex.py --resumen)
          else
            python vigilante_radar_forex.py || (sleep 30 && python vigilante_radar_forex.py)
          fi
      - name: Ejecutar vigilante RADAR M5-M15-M30-H1-H2-H4 (mismos mercados que el RADAR CAMBIO TENDENCIAS)
        if: false   # avisos automáticos desactivados el 01/11/2026
        continue-on-error: true
        run: python vigilante_radar_rapido.py || (sleep 30 && python vigilante_radar_rapido.py)
      - name: Guardar hora del último aviso
        if: always()
        run: |
          if [ -n "$(git status --porcelain estado_oro.json estado_forex.json estado_commodities.json estado_radar_commodities.json estado_radar_forex.json estado_radar_rapido.json estado_comunes_m5h4.json)" ]; then
            git config user.name "vigilante-oro"
            git config user.email "vigilante-oro@users.noreply.github.com"
            git add estado_oro.json estado_forex.json
            [ -f estado_commodities.json ] && git add estado_commodities.json
            [ -f estado_radar_commodities.json ] && git add estado_radar_commodities.json
            [ -f estado_radar_forex.json ] && git add estado_radar_forex.json
            [ -f estado_radar_rapido.json ] && git add estado_radar_rapido.json
            [ -f estado_comunes_m5h4.json ] && git add estado_comunes_m5h4.json
            git commit -m "Vigilantes: guardar último estado"
            for i in 1 2 3 4 5; do git pull --rebase -X theirs origin main && git push origin HEAD:main && break; sleep $((RANDOM % 5 + 2)); done
          fi
      - name: Guardar velas para el gráfico de la app BOLSA
        if: github.event.inputs.prueba == 'true'
        continue-on-error: true
        run: |
          python velas.py
          git config user.name "vigilante-velas"
          git config user.email "vigilante-velas@users.noreply.github.com"
          git add velas
          if ! git diff --cached --quiet; then
            git commit -m "Velas para el gráfico de la app"
            for i in 1 2 3 4 5; do git pull --rebase -X theirs origin main && git push origin HEAD:main && break; sleep $((RANDOM % 5 + 2)); done
          fi
